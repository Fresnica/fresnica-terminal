[package]
name = "fresnica-tui"
version = "0.6.0"
edition = "2021"
description = "Native terminal UI reference client for Fresnica"
license = "MIT"
publish = false

[[bin]]
name = "fresnica-tui"
path = "src/main.rs"

[dependencies]
fresnica-client.workspace = true
fresnica-terminal-presentation = { path = "../presentation" }
ratatui = "=0.30.2"
serde_json = "1"
stellar-strkey = "=0.0.18"
ureq = { version = "=3.4.0", features = ["json", "platform-verifier"] }
url = "2"
zeroize = "=1.9.0"
