[package]
name = "fresnica-cli"
version = "0.3.0"
edition = "2021"
description = "Native command-line client for the Fresnica Stellar wallet"
license = "MIT"
publish = false

[[bin]]
name = "fresnica"
path = "src/main.rs"

[dependencies]
fresnica-client.workspace = true
fresnica-terminal-presentation = { path = "../presentation" }
sha2 = "=0.10.9"
stellar-ledger = { git = "https://github.com/stellar/stellar-cli.git", rev = "b2ace0758ef85b261a8e0fa960cfe42177731517", package = "stellar-ledger" }
stellar-xdr = "=28.0.0"
rpassword = "=7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "=1.52.3", features = ["rt"] }
ureq = { version = "=3.4.0", features = ["json", "multipart"] }
zeroize = "=1.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
