[package]
name = "fresnica-cli"
version = "0.2.0"
edition = "2021"
description = "Native command-line client for the Fresnica Stellar wallet"
license = "MIT"
publish = false

[[bin]]
name = "fresnica"
path = "src/main.rs"

[dependencies]
fresnica-client.workspace = true
fresnica-terminal-presentation = { path = "../presentation" }
rpassword = "=7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
ureq = { version = "=3.4.0", features = ["json", "multipart"] }
zeroize = "=1.9.0"
