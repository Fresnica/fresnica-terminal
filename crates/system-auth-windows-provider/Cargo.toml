[package]
name = "fresnica-system-auth-windows-provider"
version = "0.3.0"
edition = "2021"
description = "High-trust Windows System Auth provider and LocalSystem broker for Fresnica Terminal"
license = "MIT"
publish = false

[lib]
name = "fresnica_system_auth_windows"
path = "src/lib.rs"

[[bin]]
name = "fresnica-system-auth-provider"
path = "src/provider.rs"

[[bin]]
name = "fresnica-system-auth-service"
path = "src/service.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
zeroize = "=1.9.0"
rsa = { version = "0.9.10", features = ["sha2"] }
signature = "2.2.0"

[dev-dependencies]
rand = "0.8.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WindowsWebServices",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8.1"
