name: Apply CLI info compatibility fix

on:
  pull_request:
    paths:
      - ".github/workflows/fix-info-compat.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Preserve existing info compatibility line
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('crates/cli/src/main.rs')
          text = p.read_text()
          old = '''    println!(\n        "Shared API:  Fresnica SDK/client @ {}",\n        diagnostics::short_fresnica_revision()\n    );\n'''
          new = '''    println!("SDK/Core:   Rust (direct link)");\n    println!(\n        "Shared API:  Fresnica SDK/client @ {}",\n        diagnostics::short_fresnica_revision()\n    );\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Shared API output block, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          cargo fmt --all -- --check
          git diff --check
          grep -F 'println!("SDK/Core:   Rust (direct link)");' crates/cli/src/main.rs
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git add crates/cli/src/main.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cli): preserve info compatibility output"
          git push origin "HEAD:${{ github.head_ref }}"
