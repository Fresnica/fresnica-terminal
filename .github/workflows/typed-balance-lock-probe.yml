name: Typed Balance Lock Probe

on:
  push:
    branches: [verify/typed-balance-lock]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply typed balance product transform
        run: python3 .github/typed-balance-transform.py
      - name: Format transformed Rust
        run: cargo fmt --all
      - name: Resolve updated Fresnica git pin
        run: cargo check --workspace
      - name: Commit generated verifier state
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock crates/cli/src/read_commands.rs crates/tui/src/app.rs crates/tui/src/render.rs; then
            echo "Verifier state already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/cli/src/read_commands.rs crates/tui/src/app.rs crates/tui/src/render.rs
          git commit -m "verify: capture typed balance product state"
          git push origin HEAD:verify/typed-balance-lock
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: typed-balance-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
