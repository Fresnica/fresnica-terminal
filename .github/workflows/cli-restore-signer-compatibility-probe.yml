name: CLI Restore Signer Compatibility Probe

on:
  push:
    branches:
      - verify/cli-restore-signer-compatibility

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply restore signer compatibility transform
        shell: bash
        run: |
          set -euo pipefail
          old_rev='5cebbf4d28b001eece8e4a3b3bc8e70a342d0e60'
          new_rev='d36e2e2e55a0452702bda4b57389067c4765d7ad'
          sed -i "s/${old_rev}/${new_rev}/g" Cargo.toml FRESNICA_REV Cargo.lock
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/cli/src/wallet.rs')
          text = path.read_text()
          old = '''        wallet_ops::verify_passcode(&record, &passcode)
            .map_err(|_| "backup does not use the current Fresnica passphrase".to_owned())?;
'''
          new = '''        wallet_ops::validate_restore_signer_compatibility(&record, &passcode)?;
'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Prove restore semantics are shared
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'wallet_ops::validate_restore_signer_compatibility' crates/cli/src/wallet.rs
          if grep -n 'backup does not use the current Fresnica passphrase' crates/cli/src/wallet.rs; then
            echo 'CLI-local restore compatibility error mapping remains' >&2
            exit 1
          fi
      - name: Validate Terminal boundary
        run: bash scripts/validate-boundary.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build release binaries
        run: |
          cargo build --release --locked -p fresnica-cli --bin fresnica
          cargo build --release --locked -p fresnica-tui --bin fresnica-tui
      - name: Commit generated verifier state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cli-restore-signer-compatibility-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "verify: materialize CLI restore signer compatibility"
          git push origin HEAD:verify/cli-restore-signer-compatibility
