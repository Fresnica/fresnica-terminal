name: Temporary network profile lock refresh

on:
  push:
    branches:
      - tmp/network-profile-lock-refresh

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Refresh pinned Fresnica source in lockfile
        shell: bash
        run: |
          set -euo pipefail
          old=7ea101bce034e85ace3260ff044c983bd5d33cdb
          new=bad39935ce173b449c714150c24a63a1391ee4e7
          expected=3540332bb530f2c358d07a32558c6267e152b07a
          count="$(grep -o "$old" Cargo.lock | wc -l)"
          test "$count" -eq 6
          sed -i "s/$old/$new/g" Cargo.lock
          test "$(git hash-object Cargo.lock)" = "$expected"
          git rm .github/workflows/tmp-network-profile-lock-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore: materialize network profile lock blob"
          git push origin "HEAD:${{ github.ref_name }}"
