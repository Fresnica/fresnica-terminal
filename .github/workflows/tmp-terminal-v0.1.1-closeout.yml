name: Temporary Terminal v0.1.1 Documentation Closeout

on:
  push:
    branches:
      - docs/terminal-v0.1.1-closeout
    paths:
      - .github/tmp-terminal-v0.1.1-closeout.py
      - .github/workflows/tmp-terminal-v0.1.1-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record completed Terminal v0.1.1 milestone
        run: python3 .github/tmp-terminal-v0.1.1-closeout.py
      - name: Validate and push documentation closeout
        shell: bash
        run: |
          set -euo pipefail
          expected=$'docs/terminal-flow-audit.md\ndocs/terminal-shared-foundation-refactor.md'
          actual="$(git diff --name-only -- docs/terminal-flow-audit.md docs/terminal-shared-foundation-refactor.md | sort)"
          test "$actual" = "$expected"
          ! grep -R "final integration pending" docs/terminal-flow-audit.md docs/terminal-shared-foundation-refactor.md
          git diff --check
          git config user.name fresnica-ci
          git config user.email actions@users.noreply.github.com
          git add docs/terminal-flow-audit.md docs/terminal-shared-foundation-refactor.md
          git commit -m "docs: close Terminal v0.1.1 hardening milestone"
          git push origin HEAD:docs/terminal-v0.1.1-closeout
