name: Terminal History Read Model Probe

on:
  push:
    branches:
      - verify/terminal-history-read-model

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply typed History consumer transform
        run: python3 .github/terminal-history-transform.py
      - name: Refresh workspace lockfile
        run: cargo check --workspace
      - name: Format workspace
        run: cargo fmt --all
      - name: Prove provider-neutral History consumption
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'Vec<HistoryOperation>' crates/tui/src/app.rs
          grep -n 'history_operation_summary' crates/cli/src/read_commands.rs crates/tui/src/render.rs
          grep -n 'history_operation_json' crates/cli/src/read_commands.rs
          if grep -R -n 'operation_summary' crates/cli crates/tui crates/presentation; then
            echo 'provider-specific operation_summary still consumed by Terminal' >&2
            exit 1
          fi
          if grep -R -n 'Horizon operations\|Updated from Horizon' crates/cli crates/tui; then
            echo 'provider-specific History UI wording remains' >&2
            exit 1
          fi
          if grep -R -n 'serde_json::Value' crates/tui/src; then
            echo 'provider JSON still stored/rendered in TUI History path' >&2
            exit 1
          fi
          test "$(cat FRESNICA_REV)" = "65a9da804ca16849e320d24365e6e839e62cf5d8"
      - name: Validate Terminal boundary
        run: bash scripts/validate-boundary.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build release binaries
        run: |
          cargo build --release --locked -p fresnica-cli --bin fresnica
          cargo build --release --locked -p fresnica-tui --bin fresnica-tui
      - name: Commit generated verifier state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/terminal-history-read-model-probe.yml
          rm .github/terminal-history-transform.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "verify: materialize terminal typed History consumer"
          git push origin HEAD:verify/terminal-history-read-model
