name: Temporary Terminal v0.1.1 Prep

on:
  push:
    branches: [release/terminal-v0.1.1]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare exact v0.1.1 release patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("crates/cli/Cargo.toml", 'version = "0.1.0"', 'version = "0.1.1"')
          replace_once("crates/tui/Cargo.toml", 'version = "0.1.0"', 'version = "0.1.1"')
          replace_once(
              "Cargo.lock",
              'name = "fresnica-cli"\nversion = "0.1.0"',
              'name = "fresnica-cli"\nversion = "0.1.1"',
          )
          replace_once(
              "Cargo.lock",
              'name = "fresnica-tui"\nversion = "0.1.0"',
              'name = "fresnica-tui"\nversion = "0.1.1"',
          )

          marker = {
              "kind": "fresnica-terminal-release",
              "version": "0.1.1",
              "channel": "preview",
              "fresnica_rev": "9ba6f23cefe34e8d5940b311ec78f27eed982fe7",
              "native_sdk_baseline": "0.3.0",
              "native_binding_api_version": 3,
              "sdk_api_version": 5,
              "core_client_api_version": 5,
              "products": ["fresnica", "fresnica-tui"],
          }
          Path("releases/terminal-v0.1.1.json").write_text(json.dumps(marker, indent=2) + "\n")
          PY

          expected=$'Cargo.lock\ncrates/cli/Cargo.toml\ncrates/tui/Cargo.toml\nreleases/terminal-v0.1.1.json'
          actual="$(git diff --name-only -- Cargo.lock crates/cli/Cargo.toml crates/tui/Cargo.toml releases/terminal-v0.1.1.json | sort)"
          test "$actual" = "$expected"

          lock_before="$(sha256sum Cargo.lock | awk '{print $1}')"
          bash scripts/validate-boundary.sh
          cargo check --workspace --locked
          cargo fmt --all -- --check
          git diff --check
          lock_after="$(sha256sum Cargo.lock | awk '{print $1}')"
          test "$lock_before" = "$lock_after"

          git config user.name fresnica-ci
          git config user.email actions@users.noreply.github.com
          git add Cargo.lock crates/cli/Cargo.toml crates/tui/Cargo.toml releases/terminal-v0.1.1.json
          git commit -m "release: prepare Fresnica Terminal v0.1.1"
          git push origin HEAD:release/terminal-v0.1.1
