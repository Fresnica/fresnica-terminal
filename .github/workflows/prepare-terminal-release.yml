                  let args = ["send", "1", "XLM", "to", "G...", "--memo", "-vv"]
                      .map(str::to_owned);
                  assert_eq!(leading_verbosity(&args), 0);
                  assert_eq!(safe_diagnostic_command(&args).as_deref(), Some("send"));
              }

              #[test]
              fn diagnostics_only_emit_whitelisted_subcommands() {
                  let args = ["-vv", "wallet", "import-secret", "private-value"]
                      .map(str::to_owned);
                  assert_eq!(
                      safe_diagnostic_command(&args).as_deref(),
                      Some("wallet import-secret")
                  );
              }
          }
          '''
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if text.count(old) != 1:
