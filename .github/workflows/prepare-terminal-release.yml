                        raise SystemExit("invalid terminal release marker kind")
                    if data.get("channel") != "preview":
                        raise SystemExit("v0.1 release must remain on the preview channel")
                    version = data.get("version", "")
                    if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
                        raise SystemExit("invalid terminal release version")
                    expected_name = f"terminal-v{version}.json"
                    if marker_path.name != expected_name:
                        raise SystemExit(f"marker filename must be {expected_name}")
                    fresnica_rev = pathlib.Path("FRESNICA_REV").read_text().strip()
                    if data.get("fresnica_rev") != fresnica_rev:
                        raise SystemExit("release marker fresnica_rev does not match FRESNICA_REV")
                    for manifest in ("crates/cli/Cargo.toml", "crates/tui/Cargo.toml"):
                        package_version = tomllib.loads(pathlib.Path(manifest).read_text())["package"]["version"]
                        if package_version != version:
                            raise SystemExit(f"{manifest} version {package_version} != release {version}")
                    with output_path.open("a") as out:
                        out.write(f"version={version}\n")
                        out.write(f"tag=v{version}\n")
                        out.write(f"marker={marker_path.as_posix()}\n")
                        out.write(f"fresnica_rev={fresnica_rev}\n")
                    PY_RELEASE

            validate-rust:
              needs: prepare
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt
                - run: bash scripts/validate-boundary.sh
                - run: cargo fmt --all -- --check
                - run: cargo test --workspace --all-targets --locked
                - run: cargo build --release --locked -p fresnica-cli --bin fresnica
                - run: cargo build --release --locked -p fresnica-tui --bin fresnica-tui

            python-compatibility:
              needs: prepare
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                - uses: actions/checkout@v4
                  with:
                    repository: Fresnica/fresnica
                    ref: ${{ needs.prepare.outputs.fresnica_rev }}
                    path: upstream
                - run: cargo build --release --locked -p fresnica-cli --bin fresnica
                - name: Install uv
                  uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
                  with:
                    version: "0.12.5"
                    enable-cache: true
                - run: uv python install 3.11
                  working-directory: upstream/reference/python
                - run: uv sync --locked
                  working-directory: upstream/reference/python
                - run: uv run pytest -q tests/test_rust_cli_compat.py
                  working-directory: upstream/reference/python
                  env:
                    FRESNICA_RUST_CLI_BIN: ${{ github.workspace }}/target/release/fresnica

            build:
              needs: [prepare, validate-rust, python-compatibility]
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, macos-latest, windows-latest]
              runs-on: ${{ matrix.os }}
              env:
                VERSION: ${{ needs.prepare.outputs.version }}
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                - run: cargo build --release --locked -p fresnica-cli --bin fresnica
                - run: cargo build --release --locked -p fresnica-tui --bin fresnica-tui
                - name: Package Unix binaries
                  if: runner.os != 'Windows'
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p package dist
                    cp target/release/fresnica package/
                    cp target/release/fresnica-tui package/
                    cp README.md package/README.md
                    cp crates/cli/README.md package/CLI-README.md
                    cp crates/tui/README.md package/TUI-README.md
                    archive="fresnica-terminal-${VERSION}-${RUNNER_OS,,}-${RUNNER_ARCH,,}.zip"
                    (cd package && zip -9 -r "../dist/$archive" .)
                - name: Package Windows binaries
                  if: runner.os == 'Windows'
                  shell: pwsh
                  run: |
                    New-Item -ItemType Directory -Force package, dist | Out-Null
                    Copy-Item target/release/fresnica.exe package/
                    Copy-Item target/release/fresnica-tui.exe package/
                    Copy-Item README.md package/README.md
                    Copy-Item crates/cli/README.md package/CLI-README.md
                    Copy-Item crates/tui/README.md package/TUI-README.md
                    $os = $env:RUNNER_OS.ToLower()
                    $arch = $env:RUNNER_ARCH.ToLower()
                    $archive = "fresnica-terminal-$env:VERSION-$os-$arch.zip"
                    Compress-Archive -Path package/* -DestinationPath "dist/$archive" -CompressionLevel Optimal
                - uses: actions/upload-artifact@v4
                  with:
                    name: terminal-${{ runner.os }}-${{ runner.arch }}
                    path: dist/*
                    if-no-files-found: error

            publish:
              needs: [prepare, build]
              runs-on: ubuntu-latest
              env:
                GH_TOKEN: ${{ github.token }}
                VERSION: ${{ needs.prepare.outputs.version }}
                TAG: ${{ needs.prepare.outputs.tag }}
                FRESNICA_REV: ${{ needs.prepare.outputs.fresnica_rev }}
                MARKER: ${{ needs.prepare.outputs.marker }}
              steps:
                - uses: actions/checkout@v4
                - uses: actions/download-artifact@v4
                  with:
                    pattern: terminal-*
                    path: dist
                    merge-multiple: true
                - name: Build release manifest and checksums
                  shell: bash
                  run: |
                    set -euo pipefail
                    cp "$MARKER" dist/terminal-release-marker.json
                    python3 <<'PY_MANIFEST'
                    import hashlib
                    import json
                    import os
                    from pathlib import Path

                    dist = Path("dist")
                    assets = {}
                    for path in sorted(dist.glob("*.zip")):
                        assets[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
                    manifest = {
                        "kind": "fresnica-terminal-release-manifest",
                        "version": os.environ["VERSION"],
                        "commit": os.environ["GITHUB_SHA"],
                        "fresnica_rev": os.environ["FRESNICA_REV"],
                        "assets": assets,
                    }
                    (dist / "fresnica-terminal-release-manifest.json").write_text(
                        json.dumps(manifest, indent=2) + "\n"
                    )
                    PY_MANIFEST
                    (cd dist && sha256sum *.zip fresnica-terminal-release-manifest.json terminal-release-marker.json > SHA256SUMS)
                - name: Publish preview release
                  shell: bash
                  run: |
                    set -euo pipefail
                    if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      echo "Release $TAG already exists; refusing to overwrite it." >&2
                      exit 1
                    fi
                    cat > release-notes.md <<EOF
                    Fresnica Terminal v${VERSION} is the first independent preview release of the Rust terminal products.

                    - \\`fresnica\\`: CLI with safe \\`-v\\` / \\`-vv\\` failure diagnostics and aligned Passphrase terminology.
                    - \\`fresnica-tui\\`: interactive terminal UI from the same reviewed source line.
                    - Shared Fresnica source: \\`${FRESNICA_REV}\\`, the commit that published Native SDK v0.3.0 (Native API 3 / SDK API 5 / Core Client API 5).
                    - Terminal continues to consume the Rust client/SDK boundary directly; Native/UniFFI binaries are not a terminal dependency.
                    - Platform archives are accompanied by a release manifest and SHA-256 checksums.
                    EOF
                    gh release create "$TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --target "$GITHUB_SHA" \
                      --title "Fresnica Terminal v${VERSION}" \
                      --prerelease \
                      --notes-file release-notes.md \
                      dist/*.zip \
                      dist/fresnica-terminal-release-manifest.json \
                      dist/terminal-release-marker.json \
                      dist/SHA256SUMS
          '''
          release_workflow = textwrap.dedent(release_workflow)
          Path(".github/workflows/release.yml").write_text(release_workflow)
          PY
      - name: Format and validate repository boundary
        shell: bash
        run: |
          cargo fmt --all
          bash scripts/validate-boundary.sh
          cargo fmt --all -- --check
          git diff --check
      - name: Run locked Rust tests
        run: cargo test --workspace --all-targets --locked
      - name: Build release binaries
        run: |
          cargo build --release --locked -p fresnica-cli --bin fresnica
          cargo build --release --locked -p fresnica-tui --bin fresnica-tui
      - name: Commit clean release preparation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-terminal-release.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: prepare Fresnica Terminal v0.1.0"
          git push origin "HEAD:${GITHUB_REF_NAME}"
