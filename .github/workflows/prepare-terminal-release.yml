          cli_readme.write_text(text)

          # Root project contract: extraction origin is historical, active shared pin moves independently.
          root = Path("README.md")
          text = root.read_text()
          old = "This repository was extracted from `Fresnica/fresnica` at source commit `8c06bce3fb51ac04e4e94c41d3a99c5c6db77b03`."
          new = "This repository was extracted from `Fresnica/fresnica` at source commit `8c06bce3fb51ac04e4e94c41d3a99c5c6db77b03`. The active shared-source baseline is independent of that historical extraction point and is always the exact commit recorded in `FRESNICA_REV`. Terminal v0.1.0 pins `b1d0427ec5c5398c3bb2e01b886e4e3084e46a73`, the source commit that published Native SDK v0.3.0 (Native Binding API 3 / Universal SDK API 5 / Core Client API 5). Terminal consumes the Rust `fresnica-client` / `fresnica-sdk` boundary directly; it does not consume the Native/UniFFI package."
          if text.count(old) != 1:
