                version: ${{ steps.release.outputs.version }}
                tag: ${{ steps.release.outputs.tag }}
                marker: ${{ steps.release.outputs.marker }}
                fresnica_rev: ${{ steps.release.outputs.fresnica_rev }}
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 2
                - id: release
                  shell: bash
                  run: |
                    set -euo pipefail
                    mapfile -t markers < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^releases/terminal-v[0-9]+\.[0-9]+\.[0-9]+\.json$' || true)
                    if [[ ${#markers[@]} -ne 1 ]]; then
                      echo "Expected exactly one terminal release marker in $GITHUB_SHA; found ${#markers[@]}." >&2
                      exit 1
