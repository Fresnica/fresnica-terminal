name: Export terminal source

on:
  push:
    branches:
      - release/terminal-v0.1.0-diagnostics
    paths:
      - .github/workflows/prepare-terminal-release.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/fresnica-terminal-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: fresnica-terminal-source
          path: /tmp/fresnica-terminal-source.tgz
          if-no-files-found: error
