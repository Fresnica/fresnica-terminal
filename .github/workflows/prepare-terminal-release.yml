          '''
          diagnostics = textwrap.dedent(diagnostics)
          if text.count("## Build\n") != 1:
              raise SystemExit("CLI README: Build heading missing")
          text = text.replace("## Build\n", diagnostics + "## Build\n")
          old_non_goal = "Local chain-data caching, anchor protocols, and TUI presentation remain in the\nPython reference for now."
