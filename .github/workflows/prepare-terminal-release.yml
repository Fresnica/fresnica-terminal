name: Apply terminal code patch

on:
  pull_request:
    paths:
      - ".github/workflows/prepare-terminal-release.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact non-workflow patch and validate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/terminal.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/terminal.patch.gz.b64 | gzip -d > /tmp/terminal.patch
          echo "ad76f6451b4eadc95c264d2c8360a8c109e8171e548bc2e044c2330bed986cdf  /tmp/terminal.patch" | sha256sum -c -
          git apply -p1 --check /tmp/terminal.patch
          git apply -p1 /tmp/terminal.patch
          bash scripts/validate-boundary.sh
          cargo fmt --all -- --check
          git diff --check
          cargo test --workspace --all-targets --locked
          cargo build --release --locked -p fresnica-cli --bin fresnica
          cargo build --release --locked -p fresnica-tui --bin fresnica-tui
      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "Relay must not modify workflow files." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: prepare Fresnica Terminal v0.1.0 code"
          git push origin "HEAD:${{ github.head_ref }}"
