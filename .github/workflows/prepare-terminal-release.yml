name: Prepare terminal release

on:
  push:
    branches:
      - release/terminal-v0.1.0-diagnostics
    paths:
      - .github/workflows/prepare-terminal-release.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply audited terminal release changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import textwrap

          OLD = "8c06bce3fb51ac04e4e94c41d3a99c5c6db77b03"
          NEW = "b1d0427ec5c5398c3bb2e01b886e4e3084e46a73"

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Move the independent terminal repository to the exact shared source
          # revision that published Native SDK 0.3.0. Terminal still consumes the
          # Rust client/SDK directly; it does not depend on Native/UniFFI artifacts.
          Path("FRESNICA_REV").write_text(NEW + "\n")
          replace("Cargo.toml", OLD, NEW, expected=2)
          lock = Path("Cargo.lock")
          lock_text = lock.read_text()
          if lock_text.count(OLD) != 6:
              raise SystemExit(f"Cargo.lock: expected 6 old revision occurrences, found {lock_text.count(OLD)}")
          lock.write_text(lock_text.replace(OLD, NEW))

          main = Path("crates/cli/src/main.rs")
          text = main.read_text()

          old = 'use zeroize::Zeroizing;\n\nconst HELP: &str = r#"Fresnica native Rust CLI'
          new = 'use zeroize::Zeroizing;\n\nconst FRESNICA_REVISION: &str = include_str!("../../../FRESNICA_REV");\n\nconst HELP: &str = r#"Fresnica native Rust CLI'
          if text.count(old) != 1:
              raise SystemExit("main.rs: unable to insert Fresnica revision constant")
          text = text.replace(old, new)

          old = '  fresnica [--home PATH] [--network mainnet|testnet] anchor status CODE:GISSUER ID [--wallet NAME] [--protocol sep24|sep6] [--pay] [-y] [--json]\n  fresnica [--home PATH] [--network mainnet|testnet] wallet COMMAND ...\n\nNetwork commands:'
          new = '  fresnica [--home PATH] [--network mainnet|testnet] anchor status CODE:GISSUER ID [--wallet NAME] [--protocol sep24|sep6] [--pay] [-y] [--json]\n  fresnica [--home PATH] [--network mainnet|testnet] anchor customer CODE:GISSUER [--wallet NAME] [--id CUSTOMER_ID] [--transaction ID] [--type TYPE] [--lang LANG] [--input PATH|-] [--json]\n  fresnica [--home PATH] [--network mainnet|testnet] wallet COMMAND ...\n\nGlobal options:\n  -v, --verbose                Show safe failure context\n  -vv                          Add command/network/version diagnostics without dumping raw arguments\n\nNetwork commands:'
          if text.count(old) != 1:
              raise SystemExit("main.rs: unable to update help/global options")
          text = text.replace(old, new)

          old = '''fn main() {
              if let Err(error) = run() {
                  eprintln!("Error: {error}");
                  process::exit(2);
              }
          }

          fn run() -> Result<(), String> {
              let arguments: Vec<String> = env::args().skip(1).collect();
              let global = GlobalOptions::parse(&arguments)?;
          '''
          new = '''fn main() {
              let arguments: Vec<String> = env::args().skip(1).collect();
              let global = match GlobalOptions::parse(&arguments) {
                  Ok(global) => global,
                  Err(error) => {
                      let failure = CliFailure::new(error, "parsing global options");
                      render_failure(&failure, leading_verbosity(&arguments), &arguments);
                      process::exit(2);
                  }
              };
              let verbosity = global.verbosity;
              if let Err(failure) = run(global) {
                  render_failure(&failure, verbosity, &arguments);
                  process::exit(2);
              }
          }

          fn run(global: GlobalOptions) -> Result<(), CliFailure> {
          '''
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if text.count(old) != 1:
              raise SystemExit("main.rs: unable to replace main/run entrypoint")
          text = text.replace(old, new)

          old = '''    if global.command == ["--version"] || global.command == ["-V"] {
              println!("fresnica {} · Rust Core linked", env!("CARGO_PKG_VERSION"));
              return Ok(());
          }

              let client = FresnicaClient::new(&global.home, &global.network)?;
              let storage = client.storage();
              match global.command[0].as_str() {
                  "info" => command_info(storage, &global.command[1..]),
                  "account" => read_commands::command_account(&client, &global.command[1..]),
                  "balance" | "assets" => read_commands::command_balance(&client, &global.command[1..]),
                  "history" => read_commands::command_history(&client, &global.command[1..]),
                  "send" => send::command_send(&client, &global.command[1..]),
                  "contact" => contacts::command_contact(storage, &global.command[1..]),
                  "trust" => trust::command_trust(&client, &global.command[1..]),
                  "dex" => dex::command_dex(&client, &global.command[1..]),
                  "anchor" => anchor::command_anchor(&client, &global.command[1..]),
                  "wallet" => command_wallet(storage, &global.network, &global.command[1..]),
                  other => Err(format!("unknown command: {other}\\n\\n{HELP}")),
              }
          }
          '''
          new = '''    if global.command == ["--version"] || global.command == ["-V"] {
              println!(
                  "fresnica {} · Fresnica source {}",
                  env!("CARGO_PKG_VERSION"),
                  short_fresnica_revision()
              );
              return Ok(());
          }

              let client = FresnicaClient::new(&global.home, &global.network)
                  .map_err(|error| CliFailure::new(error, "initializing Fresnica client"))?;
              let storage = client.storage();
              let result: Result<(), String> = match global.command[0].as_str() {
                  "info" => command_info(storage, &global.command[1..]),
                  "account" => read_commands::command_account(&client, &global.command[1..]),
                  "balance" | "assets" => read_commands::command_balance(&client, &global.command[1..]),
                  "history" => read_commands::command_history(&client, &global.command[1..]),
                  "send" => send::command_send(&client, &global.command[1..]),
                  "contact" => contacts::command_contact(storage, &global.command[1..]),
                  "trust" => trust::command_trust(&client, &global.command[1..]),
                  "dex" => dex::command_dex(&client, &global.command[1..]),
                  "anchor" => anchor::command_anchor(&client, &global.command[1..]),
                  "wallet" => command_wallet(storage, &global.network, &global.command[1..]),
                  other => Err(format!("unknown command: {other}\\n\\n{HELP}")),
              };
              result.map_err(|error| CliFailure::new(error, command_context(&global.command)))
          }
          '''
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if text.count(old) != 1:
              raise SystemExit("main.rs: unable to replace version/dispatch block")
          text = text.replace(old, new)

          old = '''struct GlobalOptions {
              home: PathBuf,
              network: String,
              command: Vec<String>,
          }
          '''
          new = '''struct GlobalOptions {
              home: PathBuf,
              network: String,
              verbosity: u8,
              command: Vec<String>,
          }
          '''
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if text.count(old) != 1:
              raise SystemExit("main.rs: unable to add verbosity field")
          text = text.replace(old, new)

          old = '        let mut home = None;\n        let mut network = "mainnet".to_owned();\n        let mut index = 0;'
          new = '        let mut home = None;\n        let mut network = "mainnet".to_owned();\n        let mut verbosity = 0u8;\n        let mut index = 0;'
          if text.count(old) != 1:
              raise SystemExit("main.rs: unable to initialize verbosity")
          text = text.replace(old, new)

          old = '''            match arguments[index].as_str() {
                      "--home" => {
          '''
          new = '''            match arguments[index].as_str() {
                      "-v" | "--verbose" => {
                          verbosity = (verbosity + 1).min(2);
                          index += 1;
                      }
                      "-vv" => {
                          verbosity = 2;
                          index += 1;
                      }
                      "--home" => {
          '''
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if text.count(old) != 1:
              raise SystemExit("main.rs: unable to add verbosity parser")
          text = text.replace(old, new)

          old = '        Ok(Self {\n            home,\n            network,\n            command: arguments[index..].to_vec(),\n        })'
          new = '        Ok(Self {\n            home,\n            network,\n            verbosity,\n            command: arguments[index..].to_vec(),\n        })'
          if text.count(old) != 1:
              raise SystemExit("main.rs: unable to store verbosity")
          text = text.replace(old, new)

          marker = 'fn command_info(storage: &WalletStorage, arguments: &[String]) -> Result<(), String> {'
          helpers = r'''
          #[derive(Debug)]
          struct CliFailure {
              message: String,
              context: &'static str,
          }

          impl CliFailure {
              fn new(message: String, context: &'static str) -> Self {
                  Self { message, context }
              }
          }

          fn fresnica_revision() -> &'static str {
              FRESNICA_REVISION.trim()
          }

          fn short_fresnica_revision() -> &'static str {
              let revision = fresnica_revision();
              revision.get(..12).unwrap_or(revision)
          }

          fn render_failure(failure: &CliFailure, verbosity: u8, arguments: &[String]) {
              eprintln!("Error: {}", failure.message);
              if verbosity == 0 {
                  eprintln!("Hint: rerun with -v for diagnostic context.");
                  return;
              }
              eprintln!("Context: {}", failure.context);
              if verbosity == 1 {
                  eprintln!("Hint: use -vv for safe command/network/version diagnostics.");
                  return;
              }
              eprintln!("Diagnostic:");
              eprintln!(
                  "  command: {}",
                  safe_diagnostic_command(arguments).as_deref().unwrap_or("-")
              );
              eprintln!("  network: {}", diagnostic_network(arguments));
              eprintln!("  cli-version: {}", env!("CARGO_PKG_VERSION"));
              eprintln!("  fresnica-source: {}", fresnica_revision());
              eprintln!("  note: additional diagnostics omit raw arguments and secret input");
          }

          fn leading_verbosity(arguments: &[String]) -> u8 {
              let mut verbosity = 0u8;
              let mut index = 0;
              while index < arguments.len() {
                  match arguments[index].as_str() {
                      "-v" | "--verbose" => {
                          verbosity = (verbosity + 1).min(2);
                          index += 1;
                      }
                      "-vv" => {
                          verbosity = 2;
                          index += 1;
                      }
                      "--home" | "--network" => {
                          if index + 1 >= arguments.len() {
                              break;
                          }
                          index += 2;
                      }
                      _ => break,
                  }
              }
              verbosity
          }

          fn diagnostic_network(arguments: &[String]) -> &'static str {
              let mut network = "mainnet";
              let mut index = 0;
              while index < arguments.len() {
                  match arguments[index].as_str() {
                      "-v" | "--verbose" | "-vv" => index += 1,
                      "--home" => {
                          if index + 1 >= arguments.len() {
                              return "<invalid>";
                          }
                          index += 2;
                      }
                      "--network" => {
                          let Some(value) = arguments.get(index + 1) else {
                              return "<invalid>";
                          };
                          network = match value.as_str() {
                              "mainnet" => "mainnet",
                              "testnet" => "testnet",
                              _ => "<invalid>",
                          };
                          index += 2;
                      }
                      _ => break,
                  }
              }
              network
          }

          fn safe_diagnostic_command(arguments: &[String]) -> Option<String> {
              let mut index = 0;
              while index < arguments.len() {
                  match arguments[index].as_str() {
                      "-v" | "--verbose" | "-vv" => index += 1,
                      "--home" | "--network" => {
                          if index + 1 >= arguments.len() {
                              return None;
                          }
                          index += 2;
                      }
                      _ => break,
                  }
              }
              let command = arguments.get(index)?.as_str();
              let mut path = command.to_owned();
              let allowed_subcommand = match command {
                  "wallet" => matches!(
                      arguments.get(index + 1).map(String::as_str),
                      Some(
                          "list"
                              | "use"
                              | "create"
                              | "import-secret"
                              | "import-mnemonic"
                              | "import-watch"
                              | "attach-secret"
                              | "attach-mnemonic"
                              | "detach-signer"
                              | "testnet-fund"
                              | "fund"
                              | "reveal"
                              | "backup"
                              | "restore"
                              | "delete"
                      )
                  ),
                  "contact" => matches!(
                      arguments.get(index + 1).map(String::as_str),
                      Some("list" | "add" | "remove")
                  ),
                  "trust" => matches!(
                      arguments.get(index + 1).map(String::as_str),
                      Some("add" | "limit" | "remove")
                  ),
                  "dex" => matches!(
                      arguments.get(index + 1).map(String::as_str),
                      Some(
                          "orderbook"
                              | "offers"
                              | "buy"
                              | "sell"
                              | "update"
                              | "cancel"
                              | "trades"
                              | "fills"
                              | "candles"
                      )
                  ),
                  "anchor" => matches!(
                      arguments.get(index + 1).map(String::as_str),
                      Some("discover" | "auth" | "deposit" | "withdraw" | "status" | "customer")
                  ),
                  _ => false,
              };
              if allowed_subcommand {
                  path.push(' ');
                  path.push_str(&arguments[index + 1]);
              }
              Some(path)
          }

          fn command_context(command: &[String]) -> &'static str {
              match command.first().map(String::as_str) {
                  Some("info" | "wallet" | "contact") => "processing local terminal state",
                  Some("account" | "balance" | "assets" | "history") => "reading Stellar network state",
                  Some("send") => "processing payment transaction",
                  Some("trust") => "processing trustline transaction",
                  Some("dex") => "processing Stellar DEX command",
                  Some("anchor") => "processing Stellar anchor protocol command",
                  _ => "dispatching CLI command",
              }
          }

          '''
          helpers = textwrap.dedent(helpers)
          if text.count(marker) != 1:
              raise SystemExit("main.rs: unable to insert diagnostics helpers")
          text = text.replace(marker, helpers + marker)

          old = '    println!("SDK/Core:   Rust (direct link)");'
          new = '    println!("Shared API: Fresnica SDK/client @ {}", short_fresnica_revision());'
          if text.count(old) != 1:
              raise SystemExit("main.rs: unable to align runtime architecture label")
          text = text.replace(old, new)

          old = '''        assert_eq!(options.strength, 128);
              }
          }
          '''
          new = '''        assert_eq!(options.strength, 128);
              }

              #[test]
              fn parses_global_verbosity_without_a_cli_framework() {
                  let args = ["-v", "--network", "testnet", "--verbose", "account"]
                      .map(str::to_owned);
                  let global = GlobalOptions::parse(&args).unwrap();
                  assert_eq!(global.verbosity, 2);
                  assert_eq!(global.network, "testnet");
