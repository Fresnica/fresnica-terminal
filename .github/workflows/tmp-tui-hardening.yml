name: Temporary TUI hardening verifier

on:
  push:
    branches: [refactor/terminal-shared-foundation]
    paths:
      - ".github/workflows/tmp-tui-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/terminal-shared-foundation
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Add and prove local state-transition tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_tui_hardening.py tests
          cargo fmt --all
          cargo test -p fresnica-tui --locked
          git diff --check
          git config user.name fresnica-ci
          git config user.email actions@users.noreply.github.com
          git add crates/tui/src/main.rs
          git commit -m "test(tui): cover local state transitions"
          echo "TEST_COMMIT=$(git rev-parse HEAD)"
      - name: Split and validate TUI presentation responsibilities
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_tui_hardening.py split
          cargo fmt --all
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo build --release --locked -p fresnica-cli --bin fresnica
          cargo build --release --locked -p fresnica-tui --bin fresnica-tui
          git diff --check
          git add crates/tui/src/main.rs crates/tui/src/app.rs crates/tui/src/render.rs crates/tui/src/state.rs .github/workflows/ci.yml .github/workflows/release.yml
          git commit -m "refactor(tui): separate presentation responsibilities"
          echo "REFACTOR_COMMIT=$(git rev-parse HEAD)"
          echo "TUI_MAIN_LINES=$(wc -l < crates/tui/src/main.rs)"
          echo "TUI_APP_LINES=$(wc -l < crates/tui/src/app.rs)"
          echo "TUI_STATE_LINES=$(wc -l < crates/tui/src/state.rs)"
          echo "TUI_RENDER_LINES=$(wc -l < crates/tui/src/render.rs)"
      - name: Attempt branch update
        shell: bash
        run: |
          set -u
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git log --oneline -4
          set +e
          git push origin HEAD:refactor/terminal-shared-foundation
          status=$?
          set -e
          echo "PUSH_STATUS=$status"
          exit 0
