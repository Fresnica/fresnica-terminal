name: CLI Watch-only Registration Probe

on:
  push:
    branches:
      - verify/cli-watch-registration

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply CLI watch-only boundary transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_rev = '68e48899b85c767b92b83eebb7db07d7c0e6f258'
          new_rev = '38fd73edb4d685fc3433ca157ccdccc4596b85c1'

          root = Path('Cargo.toml')
          text = root.read_text()
          old = f'''[workspace.dependencies.fresnica-client]\ngit = "https://github.com/Fresnica/fresnica.git"\nrev = "{old_rev}"\n\n[workspace.dependencies.fresnica-sdk]\ngit = "https://github.com/Fresnica/fresnica.git"\nrev = "{old_rev}"'''
          new = f'''[workspace.dependencies.fresnica-client]\ngit = "https://github.com/Fresnica/fresnica.git"\nrev = "{new_rev}"'''
          assert old in text
          root.write_text(text.replace(old, new, 1))

          cli_manifest = Path('crates/cli/Cargo.toml')
          text = cli_manifest.read_text()
          old = 'fresnica-sdk.workspace = true\n'
          assert old in text
          cli_manifest.write_text(text.replace(old, '', 1))

          wallet = Path('crates/cli/src/wallet.rs')
          text = wallet.read_text()
          assert 'use fresnica_sdk::{FresnicaSdk, SdkAccountKind};\n' in text
          text = text.replace('use fresnica_sdk::{FresnicaSdk, SdkAccountKind};\n', '', 1)
          assert 'use serde_json::Map;\n' in text
          text = text.replace('use serde_json::Map;\n', '', 1)
          old = 'use crate::{diagnostics, expand_path, friendbot, prompt_hidden, validate_network, HELP};'
          new = 'use crate::{diagnostics, expand_path, friendbot, prompt_hidden, HELP};'
          assert old in text
          text = text.replace(old, new, 1)

          start = text.index('fn wallet_import_watch(')
          end = text.index('fn wallet_attach_secret', start)
          replacement = '''fn wallet_import_watch(\n    storage: &WalletStorage,\n    network: &str,\n    name: &str,\n    address: &str,\n) -> Result<(), String> {\n    let record = wallet_ops::import_watch_record(name, network, address)?;\n    save_new_record(storage, &record)?;\n    println!("Added watch-only wallet \\\"{}\\\"", record.name);\n    Ok(())\n}\n\n'''
          text = text[:start] + replacement + text[end:]
          wallet.write_text(text)

          boundary = Path('scripts/validate-boundary.sh')
          text = boundary.read_text()
          old = '''if [[ "$(grep -F -c "rev = \\"$rev\\"" Cargo.toml)" -ne 2 ]]; then\n  echo "Both shared Fresnica workspace dependencies must be pinned to FRESNICA_REV." >&2\n  exit 1\nfi\n'''
          new = '''client_rev="$(awk '/^\\[workspace.dependencies.fresnica-client\\]$/{in_section=1; next} /^\\[/{in_section=0} in_section && /^rev = /{print; exit}' Cargo.toml)"\nif [[ "$client_rev" != "rev = \\"$rev\\"" ]]; then\n  echo "fresnica-client must be pinned to FRESNICA_REV." >&2\n  exit 1\nfi\n\nif grep -Fqx '[workspace.dependencies.fresnica-sdk]' Cargo.toml; then\n  sdk_rev="$(awk '/^\\[workspace.dependencies.fresnica-sdk\\]$/{in_section=1; next} /^\\[/{in_section=0} in_section && /^rev = /{print; exit}' Cargo.toml)"\n  if [[ "$sdk_rev" != "rev = \\"$rev\\"" ]]; then\n    echo "Direct fresnica-sdk workspace dependency must be pinned to FRESNICA_REV." >&2\n    exit 1\n  fi\nfi\n'''
          assert old in text
          boundary.write_text(text.replace(old, new, 1))

          Path('FRESNICA_REV').write_text(new_rev + '\n')
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Resolve exact Fresnica git revision
        run: cargo check --workspace
      - name: Prove CLI has no direct SDK source dependency
        shell: bash
        run: |
          if grep -RInE 'fresnica_sdk|FresnicaSdk|SdkAccountKind' crates/cli/src; then
            echo 'direct fresnica-sdk usage remains in CLI source' >&2
            exit 1
          fi
      - name: Validate Terminal boundary
        run: bash scripts/validate-boundary.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build release binaries
        run: |
          cargo build --release --locked -p fresnica-cli --bin fresnica
          cargo build --release --locked -p fresnica-tui --bin fresnica-tui
      - name: Commit generated verifier state
        shell: bash
        run: |
          rm .github/workflows/cli-watch-registration-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "verify: materialize CLI watch-only boundary"
          git push origin HEAD:verify/cli-watch-registration
