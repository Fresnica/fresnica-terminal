name: Temporary TUI Asset Picker

on:
  push:
    branches:
      - audit/terminal-capability-gap
    paths:
      - .github/workflows/tmp-tui-asset-picker.yml
      - scripts/tmp-integrate-tui-picker.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/terminal-capability-gap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Restore Cargo source cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-${{ runner.arch }}-
      - name: Apply bounded TUI picker patch
        run: python3 scripts/tmp-integrate-tui-picker.py
      - name: Format
        run: cargo fmt --all
      - name: Focused TUI tests
        run: cargo test --locked -p fresnica-tui
      - name: Workspace clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Release builds
        run: |
          cargo build --release --locked -p fresnica-cli --bin fresnica
          cargo build --release --locked -p fresnica-tui --bin fresnica-tui
      - name: Diff check
        run: git diff --check
      - name: Commit product patch
        run: |
          set -euo pipefail
          git config user.name "Eno"
          git config user.email "appweb.cn@gmail.com"
          git add crates/tui/src/app.rs crates/tui/src/render.rs crates/tui/src/main.rs
          git diff --cached --check
          git commit -m "feat(tui): add exact asset picker"
          git push origin HEAD:audit/terminal-capability-gap
