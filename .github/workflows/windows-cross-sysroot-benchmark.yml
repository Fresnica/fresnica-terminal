name: Windows Cross Cache Benchmark

on:
  push:
    branches: [ci/windows-cross-sysroot-benchmark]
    paths:
      - ".github/workflows/windows-cross-sysroot-benchmark.yml"

permissions:
  contents: read

env:
  TARGET: x86_64-pc-windows-msvc
  XWIN_ARCH: x86_64
  XWIN_CROSS_COMPILER: clang

jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Start benchmark clock
        shell: bash
        run: date +%s > .bench-start
      - name: Restore Cargo source cache
        id: cargo-sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Windows MSVC sysroot cache
        id: xwin-sysroot
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sysroot-${{ runner.os }}-${{ runner.arch }}-cargo-xwin-0.23.1
      - name: Restore cross-build target cache
        id: build-targets
        uses: actions/cache@v4
        with:
          path: |
            target/release
            target/${{ env.TARGET }}
          key: windows-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'FRESNICA_REV') }}
          restore-keys: |
            windows-target-v2-${{ runner.os }}-${{ runner.arch }}-
            windows-target-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare LLVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm
          if command -v llvm-config-18 >/dev/null; then
            llvm_config="$(command -v llvm-config-18)"
          else
            llvm_config="$(command -v llvm-config)"
          fi
          llvm_bindir="$($llvm_config --bindir)"
          echo "$llvm_bindir" >> "$GITHUB_PATH"
          export PATH="$llvm_bindir:$PATH"
          command -v clang
          command -v lld-link
      - name: Install cargo-xwin
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1
        with:
          tool: cargo-xwin@0.23.1
      - name: Prime Windows MSVC sysroot cache
        shell: bash
        run: cargo xwin cache windows-msvc-sysroot
      - name: Build Windows MSVC binaries
        shell: bash
        env:
          CARGO_SOURCE_CACHE_HIT: ${{ steps.cargo-sources.outputs.cache-hit }}
          XWIN_CACHE_HIT: ${{ steps.xwin-sysroot.outputs.cache-hit }}
          TARGET_CACHE_HIT: ${{ steps.build-targets.outputs.cache-hit }}
        run: |
          set -euo pipefail
          start="$(cat .bench-start)"
          build_start="$(date +%s)"
          cargo xwin build --release --locked --target "$TARGET" -p fresnica-cli --bin fresnica
          cargo xwin build --release --locked --target "$TARGET" -p fresnica-tui --bin fresnica-tui
          end="$(date +%s)"
          mkdir -p out/ubuntu
          cp "target/$TARGET/release/fresnica.exe" out/ubuntu/
          cp "target/$TARGET/release/fresnica-tui.exe" out/ubuntu/
          python3 - "$start" "$build_start" "$end" <<'PY'
          import json, os, pathlib, sys
          start, build_start, end = map(int, sys.argv[1:4])
          root = pathlib.Path("out/ubuntu")
          data = {
              "host": "ubuntu-cross-clang",
              "setup_seconds": build_start - start,
              "build_seconds": end - build_start,
              "total_seconds": end - start,
              "cargo_source_cache_hit": os.environ.get("CARGO_SOURCE_CACHE_HIT") == "true",
              "xwin_cache_hit": os.environ.get("XWIN_CACHE_HIT") == "true",
              "target_cache_hit": os.environ.get("TARGET_CACHE_HIT") == "true",
              "cli_bytes": (root / "fresnica.exe").stat().st_size,
              "tui_bytes": (root / "fresnica-tui.exe").stat().st_size,
          }
          (root / "benchmark.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cache-benchmark-ubuntu
          path: out/ubuntu
          if-no-files-found: error

  smoke:
    needs: cross
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-cache-benchmark-ubuntu
          path: artifacts/ubuntu
      - name: Run cross-built binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "artifacts/ubuntu/fresnica.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "artifacts/ubuntu/fresnica.exe" --help | Select-Object -First 8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "artifacts/ubuntu/fresnica-tui.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
