name: Release Terminal

on:
  push:
    branches: [main]
    paths:
      - "releases/terminal-v*.json"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "releases/terminal-v*.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "FRESNICA_REV"
      - "crates/**"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      fresnica_rev: ${{ steps.release.outputs.fresnica_rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY_RELEASE'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tomllib

          output = pathlib.Path(sys.argv[1])
          cli_version = tomllib.loads(pathlib.Path("crates/cli/Cargo.toml").read_text())["package"]["version"]
          tui_version = tomllib.loads(pathlib.Path("crates/tui/Cargo.toml").read_text())["package"]["version"]
          if cli_version != tui_version:
              raise SystemExit("CLI and TUI versions must match for a terminal release")
          version = cli_version
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("invalid terminal release version")

          event = os.environ.get("GITHUB_EVENT_NAME")
          changed = []
          version_changed = False
          if event == "push":
              changed = subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", os.environ["GITHUB_SHA"]],
                  text=True,
              ).splitlines()
          elif event == "pull_request":
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^1", "HEAD"],
                  text=True,
              ).splitlines()
              base_cli = subprocess.check_output(
                  ["git", "show", "HEAD^1:crates/cli/Cargo.toml"],
                  text=True,
              )
              base_version = tomllib.loads(base_cli)["package"]["version"]
              version_changed = base_version != version

          marker_pattern = re.compile(r"releases/terminal-v[0-9]+\.[0-9]+\.[0-9]+\.json")
          changed_markers = [path for path in changed if marker_pattern.fullmatch(path)]
          marker = pathlib.Path(f"releases/terminal-v{version}.json")
          validate_marker = event == "push" or version_changed or bool(changed_markers)

          fresnica_rev = pathlib.Path("FRESNICA_REV").read_text().strip()
          if validate_marker:
              if not marker.is_file():
                  raise SystemExit(f"missing release marker: {marker}")
              if marker.as_posix() not in changed_markers:
                  raise SystemExit(f"release change did not add/change current release marker: {marker}")
              data = json.loads(marker.read_text())
              if data.get("kind") != "fresnica-terminal-release":
                  raise SystemExit("invalid terminal release marker kind")
              if data.get("channel") != "preview":
                  raise SystemExit("terminal release marker must remain on the preview channel")
              if data.get("version") != version:
                  raise SystemExit("release marker version mismatch")
              if data.get("fresnica_rev") != fresnica_rev:
                  raise SystemExit("release marker Fresnica revision mismatch")

          with output.open("a") as out:
              out.write(f"version={version}\n")
              out.write(f"tag=v{version}\n")
              out.write(f"fresnica_rev={fresnica_rev}\n")
          PY_RELEASE

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install Linux HID build prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y libudev-dev
      - name: Restore Cargo source cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore native release target cache
        uses: actions/cache@v4
        with:
          path: target/release
          key: native-release-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'FRESNICA_REV') }}
          restore-keys: |
            native-release-target-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: bash scripts/validate-boundary.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --release --locked -p fresnica-cli --bin fresnica
      - run: cargo build --release --locked -p fresnica-anchor-plugin --bin fresnica-anchor
      - run: cargo build --release --locked -p fresnica-tui --bin fresnica-tui
      - uses: actions/checkout@v4
        with:
          repository: Fresnica/fresnica
          ref: ${{ needs.prepare.outputs.fresnica_rev }}
          path: upstream
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.11
        working-directory: upstream/reference/python
      - run: uv sync --locked
        working-directory: upstream/reference/python
      - run: uv run pytest -q tests/test_rust_cli_compat.py
        working-directory: upstream/reference/python
        env:
          FRESNICA_RUST_CLI_BIN: ${{ github.workspace }}/target/release/fresnica

  build:
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: terminal-Linux-X64
            asset_os: linux
            asset_arch: x64
            extension: ""
            binary_dir: target/release
            cross_windows: false
          - os: macos-latest
            artifact: terminal-macOS-ARM64
            asset_os: macos
            asset_arch: arm64
            extension: ""
            binary_dir: target/release
            cross_windows: false
          - os: ubuntu-latest
            artifact: terminal-Windows-X64
            asset_os: windows
            asset_arch: x64
            extension: ".exe"
            binary_dir: target/x86_64-pc-windows-msvc/release
            cross_windows: true
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native Rust toolchain
        if: ${{ !matrix.cross_windows }}
        uses: dtolnay/rust-toolchain@stable
      - name: Install Windows Rust target
        if: matrix.cross_windows
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Linux HID build prerequisite
        if: matrix.asset_os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libudev-dev
      - name: Restore Cargo source cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore native release target cache
        if: ${{ !matrix.cross_windows }}
        uses: actions/cache@v4
        with:
          path: target/release
          key: native-release-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'FRESNICA_REV') }}
          restore-keys: |
            native-release-target-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Windows MSVC sysroot cache
        if: matrix.cross_windows
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sysroot-${{ runner.os }}-${{ runner.arch }}-cargo-xwin-0.23.1
      - name: Restore Windows cross-build target cache
        if: matrix.cross_windows
        uses: actions/cache@v4
        with:
          path: |
            target/release
            target/x86_64-pc-windows-msvc
          key: windows-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'FRESNICA_REV') }}
          restore-keys: |
            windows-target-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare LLVM for Windows cross-build
        if: matrix.cross_windows
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm
          if command -v llvm-config-18 >/dev/null; then
            llvm_config="$(command -v llvm-config-18)"
          else
            llvm_config="$(command -v llvm-config)"
          fi
          llvm_bindir="$($llvm_config --bindir)"
          echo "$llvm_bindir" >> "$GITHUB_PATH"
          export PATH="$llvm_bindir:$PATH"
          command -v clang
          command -v lld-link
      - name: Install cargo-xwin
        if: matrix.cross_windows
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1
        with:
          tool: cargo-xwin@0.23.1
      - name: Prime Windows MSVC sysroot cache
        if: matrix.cross_windows
        shell: bash
        env:
          XWIN_ARCH: x86_64
          XWIN_CROSS_COMPILER: clang
        run: cargo xwin cache windows-msvc-sysroot
      - name: Build native binaries
        if: ${{ !matrix.cross_windows }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p fresnica-cli --bin fresnica
          cargo build --release --locked -p fresnica-anchor-plugin --bin fresnica-anchor
          cargo build --release --locked -p fresnica-tui --bin fresnica-tui
      - name: Build Windows MSVC binaries
        if: matrix.cross_windows
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
          XWIN_ARCH: x86_64
          XWIN_CROSS_COMPILER: clang
        run: |
          set -euo pipefail
          cargo xwin build --release --locked --target "$TARGET" -p fresnica-cli --bin fresnica
          cargo xwin build --release --locked --target "$TARGET" -p fresnica-anchor-plugin --bin fresnica-anchor
          cargo xwin build --release --locked --target "$TARGET" -p fresnica-tui --bin fresnica-tui
      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package dist
          cp "${{ matrix.binary_dir }}/fresnica${{ matrix.extension }}" package/
          cp "${{ matrix.binary_dir }}/fresnica-anchor${{ matrix.extension }}" package/
          cp "${{ matrix.binary_dir }}/fresnica-tui${{ matrix.extension }}" package/
          cp README.md package/README.md
          cp crates/cli/README.md package/CLI-README.md
          cp crates/tui/README.md package/TUI-README.md
          (cd package && zip -9 -r "../dist/fresnica-terminal-${VERSION}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: terminal-Windows-X64
          path: dist
      - name: Run Windows release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = (Get-ChildItem "dist/*.zip" | Select-Object -First 1).FullName
          Expand-Archive -Path $zip -DestinationPath package
          & "package/fresnica.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "package/fresnica.exe" --help | Select-Object -First 8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Path = "$(Resolve-Path package);$env:Path"
          & "package/fresnica.exe" plugin ls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "package/fresnica-tui.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    if: github.event_name == 'push'
    needs: [prepare, build, windows-smoke]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      FRESNICA_REV: ${{ needs.prepare.outputs.fresnica_rev }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: terminal-*
          path: dist
          merge-multiple: true
      - name: Build release manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY_MANIFEST'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          assets = {}
          for path in sorted(dist.glob("*.zip")):
              assets[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {
              "kind": "fresnica-terminal-release-manifest",
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "fresnica_rev": os.environ["FRESNICA_REV"],
              "assets": assets,
          }
          (dist / "fresnica-terminal-release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          PY_MANIFEST
          (cd dist && sha256sum *.zip fresnica-terminal-release-manifest.json > SHA256SUMS)
      - name: Publish immutable preview tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          Fresnica Terminal v${VERSION} preview release.

          - \`fresnica\`: CLI with safe \`-v\` / \`-vv\` diagnostics.
          - \`fresnica-tui\`: interactive terminal UI from the same source line.
          - Shared Fresnica source: \`${FRESNICA_REV}\`.
          - Terminal consumes the Rust client/SDK boundary directly; Native/UniFFI binaries are not a runtime dependency.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fresnica Terminal v${VERSION}" \
            --prerelease \
            --notes-file release-notes.md \
            dist/*.zip \
            dist/fresnica-terminal-release-manifest.json \
            dist/SHA256SUMS
