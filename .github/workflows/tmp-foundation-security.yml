name: Temporary Terminal foundation validation

on:
  push:
    branches:
      - refactor/terminal-shared-foundation

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/terminal-shared-foundation

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply foundation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD = "b1d0427ec5c5398c3bb2e01b886e4e3084e46a73"
          NEW = "9ba6f23cefe34e8d5940b311ec78f27eed982fe7"

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          replace_exact("Cargo.toml", f'rev = "{OLD}"', f'rev = "{NEW}"', 2)
          replace_exact("FRESNICA_REV", OLD, NEW)
          replace_exact("Cargo.lock", f"?rev={OLD}#{OLD}", f"?rev={NEW}#{NEW}", 3)

          replace_exact(
              "crates/cli/src/send.rs",
              "client.submit_payment(prepared, passcode.as_str().to_owned())?",
              "client.submit_payment(prepared, passcode.as_str())?",
          )
          replace_exact(
              "crates/cli/src/trust.rs",
              ".submit_trustline(prepared, passcode.as_str().to_owned())?",
              ".submit_trustline(prepared, passcode.as_str())?",
          )
          replace_exact(
              "crates/cli/src/dex_write.rs",
              ".submit_offer(prepared, passcode.as_str().to_owned())?",
              ".submit_offer(prepared, passcode.as_str())?",
          )
          replace_exact(
              "crates/cli/src/transaction_flow.rs",
              "passcode.as_str().to_owned(),",
              "passcode.as_str(),",
          )
          replace_exact(
              "crates/cli/src/main.rs",
              '    println!("SDK/Core:   Rust (direct link)");\n    println!("SDK/Core:   Rust (direct link)");\n',
              '    println!("SDK/Core:   Rust (direct link)");\n',
          )

          tui = Path("crates/tui/src/main.rs")
          text = tui.read_text()
          old = '''                Mode::Passcode { prepared, passcode } => {\n                    let submitted_passcode = passcode.clone();\n                    passcode.zeroize();\n                    match prepared {\n                        PreparedWrite::Payment(prepared) => {\n                            self.client.submit_payment(prepared, submitted_passcode)\n                        }\n                        PreparedWrite::Trustline(prepared) => {\n                            self.client.submit_trustline(prepared, submitted_passcode)\n                        }\n                        PreparedWrite::Offer(prepared) => {\n                            self.client.submit_offer(prepared, submitted_passcode)\n                        }\n                    }\n                }'''
          new = '''                Mode::Passcode { prepared, passcode } => {\n                    let result = match prepared {\n                        PreparedWrite::Payment(prepared) => {\n                            self.client.submit_payment(prepared, passcode.as_str())\n                        }\n                        PreparedWrite::Trustline(prepared) => {\n                            self.client.submit_trustline(prepared, passcode.as_str())\n                        }\n                        PreparedWrite::Offer(prepared) => {\n                            self.client.submit_offer(prepared, passcode.as_str())\n                        }\n                    };\n                    passcode.zeroize();\n                    result\n                }'''
          if text.count(old) != 1:
              raise SystemExit(f"crates/tui/src/main.rs: expected one passphrase submission block, found {text.count(old)}")
          tui.write_text(text.replace(old, new, 1))

          test = Path("crates/cli/tests/cli_contract.rs")
          test.parent.mkdir(parents=True, exist_ok=True)
          if test.exists():
              raise SystemExit("crates/cli/tests/cli_contract.rs already exists")
          test.write_text('''use std::fs;\nuse std::path::PathBuf;\nuse std::process::{Command, Output};\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nconst WATCH_ADDRESS: &str = "GDLVVGABQKYQVN6VJP7NHSLEA45A5YLS6PNKMIZFV4BBU2HXA5IRVHUR";\n\nfn temp_home() -> PathBuf {\n    let nonce = SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .unwrap()\n        .as_nanos();\n    std::env::temp_dir().join(format!(\n        "fresnica-cli-contract-{}-{nonce}",\n        std::process::id()\n    ))\n}\n\nfn run(home: &PathBuf, arguments: &[&str]) -> Output {\n    Command::new(env!("CARGO_BIN_EXE_fresnica"))\n        .arg("--home")\n        .arg(home)\n        .args(arguments)\n        .output()\n        .unwrap()\n}\n\n#[test]\nfn info_prints_sdk_core_compatibility_line_once() {\n    let home = temp_home();\n    let import = run(\n        &home,\n        &[\n            "--network",\n            "testnet",\n            "wallet",\n            "import-watch",\n            "observer",\n            WATCH_ADDRESS,\n        ],\n    );\n    assert!(\n        import.status.success(),\n        "import-watch failed: {}",\n        String::from_utf8_lossy(&import.stderr)\n    );\n\n    let info = run(\n        &home,\n        &["--network", "testnet", "info", "--wallet", "observer"],\n    );\n    assert!(\n        info.status.success(),\n        "info failed: {}",\n        String::from_utf8_lossy(&info.stderr)\n    );\n    let stdout = String::from_utf8(info.stdout).unwrap();\n    assert_eq!(stdout.matches("SDK/Core:   Rust (direct link)").count(), 1);\n\n    let _ = fs::remove_dir_all(home);\n}\n''')
          PY

          rustfmt --edition 2021 --config skip_children=true \
            crates/cli/src/send.rs \
            crates/cli/src/trust.rs \
            crates/cli/src/dex_write.rs \
            crates/cli/src/transaction_flow.rs \
            crates/cli/src/main.rs \
            crates/tui/src/main.rs \
            crates/cli/tests/cli_contract.rs

      - name: Validate Terminal boundary and Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-boundary.sh
          cargo fmt --all -- --check
          git diff --check
          cargo test --workspace --all-targets --locked
          cargo build --release --locked -p fresnica-cli --bin fresnica
          cargo build --release --locked -p fresnica-tui --bin fresnica-tui
          cargo clippy --workspace --all-targets --locked

      - uses: actions/checkout@v4
        with:
          repository: Fresnica/fresnica
          ref: 9ba6f23cefe34e8d5940b311ec78f27eed982fe7
          path: upstream

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Validate RefPython CLI compatibility
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          (cd upstream/reference/python && uv sync --locked)
          (cd upstream/reference/python && FRESNICA_RUST_CLI_BIN="$GITHUB_WORKSPACE/target/release/fresnica" uv run pytest -q tests/test_rust_cli_compat.py)

      - name: Commit validated foundation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fresnica-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            Cargo.toml Cargo.lock FRESNICA_REV \
            crates/cli/src/main.rs \
            crates/cli/src/send.rs \
            crates/cli/src/trust.rs \
            crates/cli/src/dex_write.rs \
            crates/cli/src/transaction_flow.rs \
            crates/cli/tests/cli_contract.rs \
            crates/tui/src/main.rs
          git diff --cached --quiet && { echo "No product diff produced"; exit 1; }
          git commit -m "fix: harden Terminal shared client boundary"
          git push origin HEAD:refactor/terminal-shared-foundation
