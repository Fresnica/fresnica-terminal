name: Typed Account Lock Probe

on:
  push:
    branches: [verify/typed-account-lock]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve updated Fresnica git pin
        run: cargo check -p fresnica-cli
      - name: Commit generated lockfile to verifier branch
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "verify: capture generated lockfile"
          git push origin HEAD:verify/typed-account-lock
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: typed-account-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
